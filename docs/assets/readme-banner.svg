  <text x="1257" y="350" fill="#a9c1b5" font-family="Georgia, serif" font-style="italic" font-size="22">x</text>
  <text x="1104" y="206" fill="#a9c1b5" font-family="Georgia, serif" font-style="italic" font-size="22">y</text>
  <rect x="1376" y="367" width="123" height="49" rx="24.5" fill="url(#paper)"/>
  <text x="1397" y="397" fill="#173933" font-family="Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="1">LEARN / 01</text>
</svg>
