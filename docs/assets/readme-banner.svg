<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Physics Bowl Study Collection</title>
  <desc id="desc">A study guide and selected problems, illustrated with a physics trajectory.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c3d5d2" stroke-opacity=".075"/>
    </pattern>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f3eee5"/>
      <stop offset="1" stop-color="#dfebdf"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="#10282c"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <path d="M80 69h34" stroke="#eeb58e" stroke-width="4"/>
  <text x="132" y="76" fill="#bad2c7" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3">THE PHYSICS BOWL STUDY COLLECTION</text>
  <text x="80" y="192" fill="#fbf7ed" font-family="Georgia, serif" font-size="80">Physics, one idea</text>
  <text x="80" y="287" fill="#fbf7ed" font-family="Georgia, serif" font-size="80">at a time<tspan fill="#eeb58e">.</tspan></text>
  <text x="84" y="359" fill="#cadbd0" font-family="Arial, sans-serif" font-size="25">A study guide + selected problems, made to work together.</text>
  <text x="84" y="430" fill="#a9c1b5" font-family="Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2">12 UNITS   /   71 EXAMPLES   /   39 PROBLEMS</text>
  <circle cx="1274" cy="250" r="184" fill="none" stroke="#b8d6c6" stroke-opacity=".16"/>
  <circle cx="1274" cy="250" r="145" fill="none" stroke="#b8d6c6" stroke-opacity=".16" stroke-dasharray="4 8"/>
  <path d="M1080 343H1491M1118 385V112" stroke="#b8d6c6" stroke-opacity=".28" stroke-width="2"/>
  <path d="M1118 343C1193 218 1292 114 1394 150C1434 164 1465 212 1484 280" fill="none" stroke="#eeb58e" stroke-width="4"/>
  <circle cx="1118" cy="343" r="6" fill="#f6eee2"/>
  <circle cx="1394" cy="150" r="7" fill="#eeb58e"/>
  <path d="M1118 343l92-117m-92 117h130m-130 0v-117" fill="none" stroke="#f4eee2" stroke-opacity=".82" stroke-width="2"/>
  <path d="M1201 228l9-2-1 10M1238 338l10 5-10 5M1113 236l5-10 5 10" fill="none" stroke="#f4eee2" stroke-opacity=".82" stroke-width="2"/>
