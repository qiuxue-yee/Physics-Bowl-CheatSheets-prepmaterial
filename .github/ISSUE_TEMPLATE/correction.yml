name: Suggest a correction
description: Report a possible error in the study guide or problem set.
title: "Correction: "
body:
  - type: dropdown
    id: book
    attributes:
      label: Book
      options:
        - Study guide
        - Problem set
        - Website or another file
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, unit, example or problem number
      description: Include the PDF page as well as the printed page, if available.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be corrected?
      description: Describe what is currently written and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reasoning or source
      description: Provide a calculation, source link, or other supporting detail.
    validations:
      required: true
